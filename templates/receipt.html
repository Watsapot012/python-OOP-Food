<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ใบเสร็จ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f8f5; margin: 0; }
        .container { max-width: 560px; margin: 60px auto; background: white; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); padding: 28px; }
        .row { display: flex; justify-content: space-between; margin: 10px 0; }
        .btn { display: inline-block; margin-top: 18px; background: #ff7f50; color: white; padding: 10px 16px; border-radius: 8px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ใบเสร็จรับสินค้า</h1>
        <p>ลูกค้า: {{ customer_name }}</p>
        {% for item in items %}
            <div class="row">
                <span>{{ item.name }} x {{ item.quantity }}</span>
                <span>{{ "%.2f"|format(item.subtotal) }} บาท</span>
            </div>
        {% endfor %}
        <hr />
        <div class="row">
            <strong>ยอดรวม</strong>
            <strong>{{ "%.2f"|format(total) }} บาท</strong>
        </div>
        <a class="btn" href="/">กลับหน้าเมนู</a>
    </div>
</body>
</html>
